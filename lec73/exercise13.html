<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            background-color: #0f0f0f;
            width: 750px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            margin: 5px;
        }
        .image{
            position: relative;
            margin-right: 15px;
        }
        .image img{
            width: 200px;
            border-radius: 10px;
        }
        .text{
            color: white;
            font-family: Roboto, Arial, sans-serif;
            font-size: 14px;
        }
        .text p{
            color: gray;
            font-size: 14px;
            
        }
        .time{
            font-family: Roboto, Arial, sans-serif;
            background-color: #646262;
            color: white;
            position: absolute;
            z-index: 1;
            bottom: 10px;
            right: 5px;
            padding: 3px;
            border-radius: 3px;
            font-size: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">

    </div>
    <script src="script.js"></script>
</body>
</html>
